<header class="header-bar">
    <a class="header-logo" routerLink="/" fragment="hero-section" [attr.aria-label]="'header.logoLabel' | translate">
        <span class="logo-mark"></span>
    </a>

    <nav class="header-nav" [attr.aria-label]="'header.navLabel' | translate">
        <ul class="nav-list">
            @for (item of navItems; track item.fragment) {
            <li><a class="nav-link" routerLink="/" [fragment]="item.fragment">{{ item.labelKey | translate }}</a></li>
            }
        </ul>
    </nav>

    <app-language-switch class="header-language" />

    <button #menuToggle class="menu-toggle" type="button" [attr.aria-label]="'header.menuOpen' | translate"
        [attr.aria-expanded]="isMenuOpen()" (click)="openMenu()"></button>
</header>

<app-menu [isOpen]="isMenuOpen()" (closed)="closeMenu()" />
