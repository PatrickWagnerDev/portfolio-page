<header class="header-bar">
    <a class="header-logo" routerLink="/" fragment="hero-section" aria-label="Patrick Wagner, Home">
        <span class="logo-mark"></span>
    </a>

    <nav class="header-nav" aria-label="Main navigation">
        <ul class="nav-list">
            <li><a class="nav-link" routerLink="/" fragment="about-me-section">About me</a></li>
            <li><a class="nav-link" routerLink="/" fragment="skills-section">Skills</a></li>
            <li><a class="nav-link" routerLink="/" fragment="projects-section">Projects</a></li>
            <li><a class="nav-link" routerLink="/" fragment="contact-section">Contact</a></li>
        </ul>
    </nav>

    <label class="language-switch">
        <span class="language-label">EN</span>
        <input class="switch-input" type="checkbox" role="switch" aria-label="Switch language"
            [checked]="language.isGerman()" (change)="language.toggleLanguage()">
        <span class="switch-track"></span>
        <span class="language-label">DE</span>
    </label>
</header>
