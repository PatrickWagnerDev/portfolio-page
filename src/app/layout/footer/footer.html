<footer class="footer-section">
    <a class="footer-logo" routerLink="/" fragment="hero-section" [attr.aria-label]="'footer.logoLabel' | translate">
        <span class="logo-mark"></span>
    </a>
    <p class="footer-copyright">© Patrick Wagner {{ currentYear }}</p>
    <nav class="footer-nav" [attr.aria-label]="'footer.navLabel' | translate">
        <ul class="footer-links">
            <li><a class="footer-link footer-legal" routerLink="/legal-notice">{{ 'footer.legalNotice' | translate }}</a></li>
            @for (link of socialLinks; track link.id) {
            <li>
                <a class="footer-link footer-social" [href]="link.url" [attr.target]="link.isExternal ? '_blank' : null"
                    [attr.rel]="link.isExternal ? 'noopener' : null">
                    {{ link.labelKey | translate }}
                    <img class="social-icon" [src]="link.iconPath" alt="">
                </a>
            </li>
            }
        </ul>
    </nav>
</footer>
