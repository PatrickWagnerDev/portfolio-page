<section id="projects-section" class="projects-section">
    <header class="projects-heading">
        <p class="section-label">My craft</p>
        <h2 class="section-title projects-title" appReveal>Projects</h2>
        <p class="projects-description">
            Encourage people to take a look and interact with your projects. Highlight your approach to creating
            responsive, user-friendly projects with efficient code.
        </p>
    </header>

    <ul class="project-list">
        @for (project of projects; track project.id) {
        <li class="project-item" [class.project-featured]="project.featured">
            <figure class="project-figure">
                <img class="project-image" [src]="project.image" [alt]="project.title + ' preview'">
                <a class="outline-button project-button" [routerLink]="['/project', project.id]">Project details</a>
                @if (project.featured) {
                <img class="project-sticker" src="/design-material/stickers/featured-sticker.webp"
                    alt="Featured project, check all details">
                }
            </figure>
            <h3 class="project-title">{{ project.title }}</h3>
            <p class="project-text">{{ project.description }}</p>
        </li>
        }
    </ul>
</section>
