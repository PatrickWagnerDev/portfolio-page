<section class="hero-section" id="hero-section">
  <p class="hero-greeting">
    <span class="greeting-text">Hello world</span>
    <span class="greeting-hover" aria-hidden="true">I'm Patrick Wagner</span>
    <img class="greeting-hand" src="design-material/icons/waving-hand.png" alt="">
  </p>

  <h1 class="hero-title" aria-label="Frontend Developer">
    @for (line of titleLines; track $index) {
    <span class="title-line" aria-hidden="true">
      <span class="line-visible">
        @for (letter of line; track $index) {
        <span class="title-letter">{{ letter }}</span>
        }
      </span>
      <span class="line-hit">
        @for (letter of line; track $index) {
        <span class="hit-letter">{{ letter }}</span>
        }
      </span>
    </span>
    }
  </h1>

  <figure class="hero-photo">
    <img class="polaroid-frame" src="design-material/stickers/polaroid-frame.webp" alt="">
  </figure>

  <a class="hero-button outline-button" href="#contact-section">Get in Touch</a>

  <ul class="social-list">
    <li>
      <a class="social-link" href="https://www.linkedin.com/in/…" aria-label="LinkedIn">
        <img src="design-material/icons/linkedin.png" alt="">
      </a>
    </li>
    <li>
      <a class="social-link" href="https://github.com/PatrickWagnerDev" aria-label="GitHub">
        <img src="design-material/icons/github.png" alt="">
      </a>
    </li>
    <li>
      <a class="social-link" href="mailto:…" aria-label="E-mail">
        <img src="design-material/icons/mail.png" alt="">
      </a>
    </li>
  </ul>
</section>
