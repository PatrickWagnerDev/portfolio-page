<section id="references-section" class="references-section">
    <header class="references-heading">
        <p class="section-label" appReveal>In their words:</p>
        <h2 class="section-title">Colleagues' Thoughts</h2>
    </header>

    <ul class="reference-list">
        @for (reference of references; track reference.name; let index = $index) {
        <li class="reference-item" [class.reference-top]="topIndex() === index" (mouseenter)="topIndex.set(index)" (focusin)="topIndex.set(index)">
            <blockquote class="reference-card">
                <p class="reference-text">{{ reference.text }}</p>
                <footer class="reference-footer">
                    <p class="reference-person">
                        <strong class="reference-name">{{ reference.name }}</strong>
                        <span class="reference-role">{{ reference.role }}</span>
                    </p>
                    @if (reference.profileUrl) {
                    <a class="reference-link" [href]="reference.profileUrl" target="_blank" rel="noopener">Profile</a>
                    }
                </footer>
            </blockquote>
        </li>
        }
    </ul>
</section>
