<section class="skills-section" id="skills-section">
    <hgroup class="skills-heading">
        <p class="skills-label section-label">{{ 'skills.label' | translate }}</p>
        <h2 class="skills-title section-title" appReveal>{{ 'skills.title' | translate }}</h2>
    </hgroup>

    <p class="skills-description">{{ 'skills.description' | translate }}</p>

    <ul class="skills-list">
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/html.png" alt="">
            <span class="skill-name">HTML</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/css.png" alt="">
            <span class="skill-name">CSS</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/javascript.png" alt="">
            <span class="skill-name">JavaScript</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/typescript.png" alt="">
            <span class="skill-name">TypeScript</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/angular.png" alt="">
            <span class="skill-name">Angular</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/firebase.png" alt="">
            <span class="skill-name">Firebase</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/supabase.png" alt="">
            <span class="skill-name">Supabase</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/git.png" alt="">
            <span class="skill-name">Git</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/rest-api.png" alt="">
            <span class="skill-name">REST-API</span>
        </li>
        <li class="skill-item">
            <img class="skill-icon" src="design-material/icons/skills/scrum.png" alt="">
            <span class="skill-name">Scrum</span>
        </li>
    </ul>

    <aside class="skills-sticker">
        <input class="peel-input" id="peel-toggle" type="checkbox">

        <section class="sticker-back">
            <p class="sticker-back-text">{{ 'skills.stickerBack' | translate }}</p>
            <ul class="interested-list">
                <li class="interested-item">
                    <img class="skill-icon" src="design-material/icons/skills/interested-in/python.png" alt="">
                    <span class="skill-name">Python</span>
                </li>
                <li class="interested-item">
                    <img class="skill-icon" src="design-material/icons/skills/interested-in/django.png" alt="">
                    <span class="skill-name">Django</span>
                </li>
            </ul>
        </section>

        <figure class="sticker-front">
            <img class="sticker-arrow" src="design-material/stickers/arrow.webp" alt="">
            <figcaption class="sticker-text">{{ 'skills.stickerPull' | translate }} <span class="sticker-word">{{ 'skills.stickerWord' | translate }}</span> {{ 'skills.stickerPeel' | translate }}</figcaption>
        </figure>

        <label class="sticker-hit" for="peel-toggle" [attr.aria-label]="'skills.stickerLabel' | translate"></label>
    </aside>
</section>
